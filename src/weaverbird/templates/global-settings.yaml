# Game Factory — global settings (draft)
# Set once by the user. Applies to every game. Secrets are referenced by name only — values live in the vault, never here.

budgets:
  tokens_per_run: null        # REQUIRED before first build
  tokens_per_game: null       # REQUIRED before first build
  cost_ceiling_per_month: null
  max_build_iterations: 40
  playtest_runs_per_iteration: 3   # breaker / competent / first-time
  warn_at_percent_of_cap: 80

models:                        # the ladder — cheap first, frontier only for judgement
  # BYOK: you bring your own keys. api_key_env is the NAME of an
  # environment variable that holds your key — never the key itself.
  # Keys are read from the environment when a call is made and are
  # never written to any file, log, ledger or report.
  # provider is "openai" (OpenAI-compatible chat completions — OpenAI,
  # OpenRouter, Together, or a local server such as Ollama / LM Studio
  # via base_url) or "anthropic" (Messages API). Leave model empty to
  # leave a tier unconfigured. cost_per_1k_tokens is optional and only
  # used to price the ledger entry; tokens are always recorded.
  cheap:    { provider: openai, model: "", base_url: null, api_key_env: OPENAI_API_KEY, cost_per_1k_tokens: null }  # classification, extraction, digests
  mid:      { provider: openai, model: "", base_url: null, api_key_env: OPENAI_API_KEY, cost_per_1k_tokens: null }  # routine code edits
  frontier: { provider: anthropic, model: "", base_url: null, api_key_env: ANTHROPIC_API_KEY, cost_per_1k_tokens: null } # design, hard debugging, judgement
  allow_local_models: true

engine:
  godot_version: "4.x-pinned"  # games never silently inherit a new engine version
  default_platforms: [windows, linux, web]

testing:                       # the headless test stage's targets
  target_fps: 30               # average FPS the competent win run must reach

defaults_for_scope_interviews:
  telemetry: false
  reply_approval_required: true
  first_storefront: itch

connectors:                    # enable/disable only — credentials in the vault
  github:   { enabled: false }
  itch:     { enabled: false }
  steam:    { enabled: false }
  play:     { enabled: false }
  apple_signing: { enabled: false }
