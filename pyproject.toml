[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weaverbird"
version = "0.4.0"
description = "An open-source game factory on top of Godot: scope, budgets, connectors, provenance, pipeline state, a grey-box skeleton builder, a bring-your-own-key brain, a local app, an evidence-based finish check, archetype game generation, asset generation and a headless test stage with scripted playtesters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.scripts]
weaverbird = "weaverbird.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weaverbird = ["templates/*", "assets/*", "web/*", "skeleton_templates/*", "skeleton_templates/*/*", "game_templates/*/*"]
