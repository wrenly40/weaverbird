[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weaverbird"
version = "0.2.0"
description = "An open-source game factory on top of Godot: scope, budgets, connectors, provenance, pipeline state and a grey-box skeleton builder."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6"]

[project.scripts]
weaverbird = "weaverbird.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weaverbird = ["templates/*", "assets/*", "skeleton_templates/*", "skeleton_templates/*/*"]
