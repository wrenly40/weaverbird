name: Tests

# Manual runs only. This account has a $0 GitHub Actions budget, so
# nothing here runs on push or pull request — run the tests locally,
# or trigger this workflow by hand when you mean to.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build the single-file app
        run: ./build.sh
      - name: Smoke-test the built app
        run: ./dist/weaverbird doctor
